name: Build Android APK & Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Validar Web e Android
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Obter versao oficial
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PKG_VER=$(node -p "require('./package.json').version")
          echo "version=v${PKG_VER}" >> "$GITHUB_OUTPUT"
          echo "VERSION=v${PKG_VER}" >> "$GITHUB_ENV"

      - name: Instalar dependencias
        run: npm ci

      - name: Validar sincronizacao da versao
        run: npm run check:version

      - name: Validar tipos
        run: npx tsc --noEmit

      - name: Executar testes de transacoes
        run: npm run test:transactions

      - name: Validar seguranca, assistente e operacao
        run: npm run test:security

      - name: Compilar Web bundle
        run: npm run build

      - name: Validar orcamento do bundle inicial
        run: npm run test:build-budget

      - name: Validar responsividade no navegador
        run: npm run test:responsive

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Validar Android SDK do Runner
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT" ]]; then
            echo "::error::O runner nao disponibilizou o Android SDK pre-instalado."
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Sincronizar Capacitor Android
        run: npx cap sync android

      - name: Preparar Gradle Wrapper
        run: |
          sed -i '/org.gradle.java.home/d' android/gradle.properties || true
          chmod +x android/gradlew

      - name: Testar e compilar variantes Android
        run: |
          cd android
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace

      - name: Localizar APK release sem assinatura
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        id: unsigned-apk
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APK_FILES < <(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*-unsigned.apk' -print)
          if (( ${#APK_FILES[@]} != 1 )); then
            echo "::error::Esperado exatamente um APK release sem assinatura; encontrados ${#APK_FILES[@]}."
            exit 1
          fi
          echo "path=${APK_FILES[0]}" >> "$GITHUB_OUTPUT"

      - name: Guardar APK release sem assinatura
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-artifact@v4
        with:
          name: finly-unsigned-${{ steps.version.outputs.version }}
          path: ${{ steps.unsigned-apk.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  release-apk:
    name: Assinar e publicar APK oficial
    needs: quality
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.quality.outputs.version }}
      EXPECTED_SIGNING_CERT_SHA256: 673AE78270CF5A92B9861D2759966EAB6F18D62FEB2DCE8F036D3683DEFFE471

    steps:
      - name: Clonar repositorio para notas da release
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verificar se a versao ja foi publicada
        shell: bash
        run: |
          set -euo pipefail
          ASSET_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/finly-${VERSION}.apk"

          if curl --fail --location --silent --head --max-time 30 "$ASSET_URL" >/dev/null; then
            echo "::notice::A release ${VERSION} e o APK oficial ja estao publicados."
            echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
            exit 0
          fi

          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "${VERSION}")
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "::error::A tag ${VERSION} existe no commit ${TAG_COMMIT}, mas a release ou o APK oficial está ausente. Incremente a versao ou repare a tag antes de publicar."
              exit 1
            fi
            echo "::warning::A tag ${VERSION} existe neste commit sem APK. O workflow tentara recuperar a publicacao."
          fi

          echo "SKIP_RELEASE=false" >> "$GITHUB_ENV"

      - name: Baixar APK release sem assinatura
        if: env.SKIP_RELEASE != 'true'
        uses: actions/download-artifact@v4
        with:
          name: finly-unsigned-${{ env.VERSION }}
          path: release-input

      - name: Configurar Java JDK 21
        if: env.SKIP_RELEASE != 'true'
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Validar Android SDK do Runner
        if: env.SKIP_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT/build-tools" ]]; then
            echo "::error::Android SDK ou Build Tools nao encontrado."
            exit 1
          fi
          BUILD_TOOLS=$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -V | tail -n 1)
          for tool in aapt apksigner zipalign; do
            if [[ ! -x "$BUILD_TOOLS/$tool" ]]; then
              echo "::error::$tool nao encontrado em $BUILD_TOOLS."
              exit 1
            fi
          done
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "AAPT_PATH=$BUILD_TOOLS/aapt" >> "$GITHUB_ENV"
          echo "APKSIGNER_PATH=$BUILD_TOOLS/apksigner" >> "$GITHUB_ENV"
          echo "ZIPALIGN_PATH=$BUILD_TOOLS/zipalign" >> "$GITHUB_ENV"

      - name: Materializar chave de assinatura
        if: env.SKIP_RELEASE != 'true'
        shell: bash
        env:
          FINLY_ANDROID_KEYSTORE_BASE64: ${{ secrets.FINLY_ANDROID_KEYSTORE_BASE64 }}
          FINLY_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FINLY_ANDROID_KEYSTORE_PASSWORD }}
          FINLY_ANDROID_KEY_ALIAS: ${{ secrets.FINLY_ANDROID_KEY_ALIAS }}
          FINLY_ANDROID_KEY_PASSWORD: ${{ secrets.FINLY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in FINLY_ANDROID_KEYSTORE_BASE64 FINLY_ANDROID_KEYSTORE_PASSWORD FINLY_ANDROID_KEY_ALIAS FINLY_ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Secrets Android ausentes: ${missing[*]}"
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/finly-release.keystore"
          printf '%s' "$FINLY_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "FINLY_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Assinar APK release
        if: env.SKIP_RELEASE != 'true'
        shell: bash
        env:
          FINLY_KS_PASSWORD: ${{ secrets.FINLY_ANDROID_KEYSTORE_PASSWORD }}
          FINLY_KEY_ALIAS: ${{ secrets.FINLY_ANDROID_KEY_ALIAS }}
          FINLY_KEY_PASSWORD: ${{ secrets.FINLY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mapfile -t APK_FILES < <(find release-input -type f -name '*-unsigned.apk' -print)
          if (( ${#APK_FILES[@]} != 1 )); then
            echo "::error::Esperado exatamente um APK sem assinatura; encontrados ${#APK_FILES[@]}."
            exit 1
          fi

          ALIGNED_APK="$RUNNER_TEMP/finly-aligned.apk"
          SIGNED_APK="finly-${VERSION}.apk"
          "$ZIPALIGN_PATH" -p -f 4 "${APK_FILES[0]}" "$ALIGNED_APK"
          "$APKSIGNER_PATH" sign \
            --ks "$FINLY_KEYSTORE_PATH" \
            --ks-key-alias "$FINLY_KEY_ALIAS" \
            --ks-pass env:FINLY_KS_PASSWORD \
            --key-pass env:FINLY_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$APKSIGNER_PATH" verify --verbose "$SIGNED_APK"
          CERT_OUTPUT=$("$APKSIGNER_PATH" verify --print-certs "$SIGNED_APK" 2>&1)
          CERT_SHA256=$(printf '%s\n' "$CERT_OUTPUT" \
            | awk -F': ' 'tolower($0) ~ /certificate sha-256 digest/ { print $NF; exit }' \
            | tr '[:lower:]' '[:upper:]' \
            | tr -d ':[:space:]')
          if [[ "$CERT_SHA256" != "$EXPECTED_SIGNING_CERT_SHA256" ]]; then
            echo "::error::Certificado incorreto: esperado=$EXPECTED_SIGNING_CERT_SHA256; recebido=${CERT_SHA256:-indisponivel}"
            exit 1
          fi

      - name: Validar versao dentro do APK
        if: env.SKIP_RELEASE != 'true'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${VERSION#v}"
          if [[ ! "$EXPECTED_VERSION" =~ ^([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})$ ]]; then
            echo "::error::Versao invalida: $EXPECTED_VERSION"
            exit 1
          fi
          EXPECTED_CODE=$((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]}))
          APK_PATH="finly-${VERSION}.apk"

          BADGING=$("$AAPT_PATH" dump badging "$APK_PATH")
          APK_VERSION_CODE=$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING")
          APK_VERSION_NAME=$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")

          BUNDLE_MANIFEST="$RUNNER_TEMP/finly-app-version.json"
          unzip -p "$APK_PATH" assets/public/app-version.json > "$BUNDLE_MANIFEST" || {
            echo "::error::app-version.json nao foi empacotado no APK."
            exit 1
          }
          BUNDLE_VERSION=$(node -e "const fs=require('node:fs'); const info=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(info.version)" "$BUNDLE_MANIFEST")

          if [[ "$APK_VERSION_NAME" != "$EXPECTED_VERSION" \
             || "$APK_VERSION_CODE" != "$EXPECTED_CODE" \
             || "$BUNDLE_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::APK divergente: esperado=$EXPECTED_VERSION/$EXPECTED_CODE; nativo=$APK_VERSION_NAME/$APK_VERSION_CODE; bundle=$BUNDLE_VERSION"
            exit 1
          fi

      - name: Gerar notas de versao
        if: env.SKIP_RELEASE != 'true'
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "## Finly - Versao ${VERSION}" > release_notes.md
          echo "" >> release_notes.md
          echo "### O que mudou nesta versao:" >> release_notes.md
          echo "" >> release_notes.md
          if [[ -n "$PREV_TAG" ]]; then
            git log "${PREV_TAG}..HEAD" --pretty=format:'- **%s** ([%h](https://github.com/${{ github.repository }}/commit/%H))' >> release_notes.md
          else
            git log -n 5 --pretty=format:'- **%s** ([%h](https://github.com/${{ github.repository }}/commit/%H))' >> release_notes.md
          fi
          printf '\n\n---\nDownload do APK: `finly-%s.apk`\n' "$VERSION" >> release_notes.md

      - name: Publicar APK como artefato
        if: env.SKIP_RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: finly-${{ env.VERSION }}
          path: finly-${{ env.VERSION }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar GitHub Release oficial
        if: env.SKIP_RELEASE != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Finly ${{ env.VERSION }}
          draft: false
          prerelease: false
          make_latest: true
          files: finly-${{ env.VERSION }}.apk
          body_path: release_notes.md
          generate_release_notes: true

      - name: Confirmar APK Oficial Publicado
        shell: bash
        run: |
          set -euo pipefail
          ASSET_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/finly-${VERSION}.apk"
          for attempt in {1..10}; do
            if curl --fail --location --silent --head --max-time 30 "$ASSET_URL" >/dev/null; then
              echo "APK oficial confirmado: $ASSET_URL"
              exit 0
            fi
            echo "Aguardando propagacao do APK oficial (${attempt}/10)..."
            sleep 3
          done
          echo "::error::O workflow terminou sem disponibilizar o APK oficial em $ASSET_URL"
          exit 1

      - name: Limpar chave temporaria
        if: always()
        shell: bash
        run: |
          if [[ -n "${FINLY_KEYSTORE_PATH:-}" ]]; then
            rm -f -- "$FINLY_KEYSTORE_PATH"
          fi
