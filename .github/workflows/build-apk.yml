name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar Finly Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar Dependências Web
        run: npm ci

      - name: 🔨 Compilar Web Bundle (Vite)
        run: npm run build

      - name: ☕ Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📱 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔄 Sincronizar Capacitor Android
        run: npx cap sync android

      - name: ⚙️ Permissões no Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 🚀 Compilar APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 🏷️ Definir Versão da Release
        id: versioning
        run: |
          VERSION="v1.1.${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          cp android/app/build/outputs/apk/debug/*.apk ./finly-${VERSION}.apk

      - name: 📤 Publicar APK como Artefato de Download
        uses: actions/upload-artifact@v4
        with:
          name: finly-${{ env.VERSION }}
          path: finly-${{ env.VERSION }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🌟 Publicar GitHub Release Oficial
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ env.VERSION }}
          name: Finly ${{ env.VERSION }}
          draft: false
          prerelease: false
          make_latest: true
          files: finly-${{ env.VERSION }}.apk
          body: |
            ## 📱 Finly - Versão ${{ env.VERSION }}
            
            ### ✨ Novidades desta versão:
            - **Modo Tela Cheia Imersivo:** Experiência imersiva sem barras indesejadas no Android.
            - **Aviso de Nova Versão:** Card inteligente ao abrir o aplicativo informando se há atualizações prontas.
            - **Central de Atualizações na aba Sobre:** Verificação, download de APK e limpeza de cache direto na aba Sobre.
            - **Gesto Nativo:** Puxe para Atualizar (Pull-to-Refresh) com sincronização em tempo real.
            - **Conta Demo 100% Otimizada:** Carregamento instantâneo com conjunto completo de dados realistas.
            
            ---
            📲 **Download do APK:** Baixe o arquivo `finly-${{ env.VERSION }}.apk` abaixo e instale diretamente no seu celular Android!
