name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar Finly Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalar Dependências Web
        run: npm ci

      - name: 🔨 Compilar Web Bundle (Vite)
        run: npm run build

      - name: ☕ Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📱 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔄 Sincronizar Capacitor Android
        run: npx cap sync android

      - name: ⚙️ Permissões no Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 🚀 Compilar APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 📤 Publicar APK como Artefato de Download
        uses: actions/upload-artifact@v4
        with:
          name: finly-app-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
