name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar Finly Android APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🏷️ Obter Versão Oficial do package.json
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          echo "VERSION=v${PKG_VER}" >> $GITHUB_ENV

      - name: 🛑 Impedir Sobrescrita de Release Existente
        run: |
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "${VERSION}")
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::A versão ${VERSION} já pertence ao commit ${TAG_COMMIT}. Atualize o package.json antes de publicar outro APK."
              exit 1
            fi
          fi

      - name: 📦 Instalar Dependências Web
        run: npm ci

      - name: ✅ Validar Sincronização da Versão
        run: npm run check:version

      - name: 🔨 Compilar Web Bundle (Vite)
        run: npm run build

      - name: ☕ Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📱 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔄 Sincronizar Capacitor Android
        run: npx cap sync android

      - name: ⚙️ Permissões no Gradle Wrapper
        run: |
          sed -i '/org.gradle.java.home/d' android/gradle.properties || true
          chmod +x android/gradlew

      - name: 🚀 Compilar APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 🔎 Validar Versão Dentro do APK
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          if [[ ! "$EXPECTED_VERSION" =~ ^([0-9]{1,3})\.([0-9]{1,3})\.([0-9]{1,3})$ ]]; then
            echo "::error::Versão inválida no package.json: $EXPECTED_VERSION"
            exit 1
          fi
          EXPECTED_CODE=$((10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 1000 + 10#${BASH_REMATCH[3]}))

          mapfile -t APK_FILES < <(find android/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print)
          if (( ${#APK_FILES[@]} != 1 )); then
            echo "::error::Esperado exatamente um APK; encontrados ${#APK_FILES[@]}."
            exit 1
          fi
          APK_PATH="${APK_FILES[0]}"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK_ROOT" || ! -d "$SDK_ROOT/build-tools" ]]; then
            echo "::error::Android Build Tools não encontrado."
            exit 1
          fi
          AAPT_PATH=$(find "$SDK_ROOT/build-tools" -type f -name aapt -print | sort -V | tail -n 1)
          if [[ -z "$AAPT_PATH" || ! -x "$AAPT_PATH" ]]; then
            echo "::error::aapt não encontrado nos Android Build Tools."
            exit 1
          fi

          BADGING=$("$AAPT_PATH" dump badging "$APK_PATH")
          APK_VERSION_CODE=$(sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" <<< "$BADGING")
          APK_VERSION_NAME=$(sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" <<< "$BADGING")

          BUNDLE_MANIFEST="$RUNNER_TEMP/finly-app-version.json"
          unzip -p "$APK_PATH" assets/public/app-version.json > "$BUNDLE_MANIFEST" || {
            echo "::error::app-version.json não foi empacotado no APK."
            exit 1
          }
          BUNDLE_VERSION=$(node -e "const fs=require('node:fs'); const info=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); process.stdout.write(info.version)" "$BUNDLE_MANIFEST")

          if [[ "$APK_VERSION_NAME" != "$EXPECTED_VERSION"
             || "$APK_VERSION_CODE" != "$EXPECTED_CODE"
             || "$BUNDLE_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::APK divergente: esperado=$EXPECTED_VERSION/$EXPECTED_CODE; nativo=$APK_VERSION_NAME/$APK_VERSION_CODE; bundle=$BUNDLE_VERSION"
            exit 1
          fi

          echo "APK validado: versionName=$APK_VERSION_NAME, versionCode=$APK_VERSION_CODE, bundle=$BUNDLE_VERSION"

      - name: 🏷️ Preparar APK da Release
        run: cp android/app/build/outputs/apk/debug/*.apk ./finly-${{ env.VERSION }}.apk

      - name: 📝 Gerar Notas de Versão Dinâmicas
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "## 📱 Finly - Versão ${{ env.VERSION }}" > release_notes.md
          echo "" >> release_notes.md
          echo "### 🚀 O que mudou nesta versão:" >> release_notes.md
          echo "" >> release_notes.md
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --pretty=format:"- **%s** ([%h](https://github.com/${{ github.repository }}/commit/%H))" >> release_notes.md
          else
            git log -n 5 --pretty=format:"- **%s** ([%h](https://github.com/${{ github.repository }}/commit/%H))" >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "📲 **Download do APK:** Baixe o arquivo \`finly-${{ env.VERSION }}.apk\` abaixo e instale diretamente no seu celular Android!" >> release_notes.md

      - name: 📤 Publicar APK como Artefato de Download
        uses: actions/upload-artifact@v4
        with:
          name: finly-${{ env.VERSION }}
          path: finly-${{ env.VERSION }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🌟 Publicar GitHub Release Oficial
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ env.VERSION }}
          name: Finly ${{ env.VERSION }}
          draft: false
          prerelease: false
          make_latest: true
          files: finly-${{ env.VERSION }}.apk
          body_path: release_notes.md
          generate_release_notes: true
