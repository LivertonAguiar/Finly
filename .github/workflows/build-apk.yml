name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compilar Finly Android APK & Release
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: 📥 Clonar Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 🏷️ Obter Versão Oficial do package.json
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          echo "VERSION=v${PKG_VER}" >> $GITHUB_ENV

      - name: 📦 Instalar Dependências Web
        run: npm ci

      - name: 🔨 Compilar Web Bundle (Vite)
        run: npm run build

      - name: ☕ Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📱 Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔄 Sincronizar Capacitor Android
        run: npx cap sync android

      - name: ⚙️ Permissões no Gradle Wrapper
        run: |
          sed -i '/org.gradle.java.home/d' android/gradle.properties || true
          chmod +x android/gradlew

      - name: 🚀 Compilar APK (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: 🏷️ Preparar APK da Release
        run: cp android/app/build/outputs/apk/debug/*.apk ./finly-${{ env.VERSION }}.apk

      - name: 📝 Gerar Notas de Versão Dinâmicas
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "## 📱 Finly - Versão ${{ env.VERSION }}" > release_notes.md
          echo "" >> release_notes.md
          echo "### 🚀 O que mudou nesta versão:" >> release_notes.md
          echo "" >> release_notes.md
          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --pretty=format:"- **%s** ([%h](https://github.com/${{ github.repository }}/commit/%H))" >> release_notes.md
          else
            git log -n 5 --pretty=format:"- **%s** ([%h](https://github.com/${{ github.repository }}/commit/%H))" >> release_notes.md
          fi
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "📲 **Download do APK:** Baixe o arquivo \`finly-${{ env.VERSION }}.apk\` abaixo e instale diretamente no seu celular Android!" >> release_notes.md

      - name: 📤 Publicar APK como Artefato de Download
        uses: actions/upload-artifact@v4
        with:
          name: finly-${{ env.VERSION }}
          path: finly-${{ env.VERSION }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: 🌟 Publicar GitHub Release Oficial
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ env.VERSION }}
          name: Finly ${{ env.VERSION }}
          draft: false
          prerelease: false
          make_latest: true
          files: finly-${{ env.VERSION }}.apk
          body_path: release_notes.md
          generate_release_notes: true
