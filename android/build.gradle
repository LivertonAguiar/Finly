// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

subprojects {
    afterEvaluate { project ->
        def currentJvmMajor = Integer.parseInt(JavaVersion.current().getMajorVersion())
        if (project.plugins.hasPlugin("org.jetbrains.kotlin.android") || project.plugins.hasPlugin("kotlin-android")) {
            project.kotlin {
                jvmToolchain(currentJvmMajor >= 21 ? 21 : 17)
            }
        }
        if (project.plugins.hasPlugin("com.android.application") || project.plugins.hasPlugin("com.android.library")) {
            project.android {
                compileOptions {
                    sourceCompatibility(currentJvmMajor >= 21 ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17)
                    targetCompatibility(currentJvmMajor >= 21 ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17)
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
