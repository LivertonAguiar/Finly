services:
  finly-app:
    build: .
    container_name: finly-app
    restart: unless-stopped
    init: true
    cpus: "1.5"
    mem_limit: 768m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - OLLAMA_HOST=http://finly-ollama:11434
    depends_on:
      - finly-ollama
    volumes:
      - ./server/data:/app/server/data
      - ./server/public/bundles:/app/server/public/bundles
      - ./server/manifest.json:/app/server/manifest.json
    networks:
      - proxy
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  finly-ollama:
    image: ollama/ollama:latest
    container_name: finly-ollama
    restart: unless-stopped
    volumes:
      - ./server/data/ollama:/root/.ollama
    networks:
      - proxy
    expose:
      - "11434"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    external: true
