services:
  finly-app:
    build: .
    container_name: finly-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./server/data:/app/server/data
    networks:
      - proxy
    ports:
      - "3000:3000"

networks:
  proxy:
    external: true
